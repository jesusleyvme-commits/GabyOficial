    <script>

    <!-- ============================================================
         TRACKING PRÓPRIO (server-side) + PIXELS
         Envia eventos para /api/track (guardados no Upstash Redis).
         ============================================================ -->
    <script>
        const TRACK_ENDPOINT = '/api/track';

        // ID anónimo persistente do visitante (para contar únicos/recorrentes)
        function getVisitorId() {
            try {
                let id = localStorage.getItem('gaby_vid');
                if (!id) {
                    id = (crypto && crypto.randomUUID)
                        ? crypto.randomUUID()
                        : 'v-' + Date.now() + '-' + Math.random().toString(16).slice(2);
                    localStorage.setItem('gaby_vid', id);
                }
                return id;
            } catch (error) {
                return 'anonimo';
            }
        }

        // Deteta se é a primeira visita (para marcar novos vs recorrentes)
        function detectFirstSeen() {
            try {
                const key = 'gaby_seen';
                if (localStorage.getItem(key)) return false;
                localStorage.setItem(key, '1');
                return true;
            } catch (error) {
                return false;
            }
        }

        // Só cria identificadores depois do consentimento (RGPD).
        let VISITOR_ID = null;
        let FIRST_SEEN = null;
        function ensureIds() {
            if (VISITOR_ID === null) {
                VISITOR_ID = getVisitorId();
                FIRST_SEEN = detectFirstSeen();
            }
        }

        // Reúne o máximo de contexto possível do visitante
        function getTrackingContext(eventLabel) {
            ensureIds();
            const params = new URLSearchParams(window.location.search);
            const campaign = {};
            ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']
                .forEach((key) => { if (params.get(key)) campaign[key] = params.get(key); });

            const ua = navigator.userAgent || '';
            return Object.assign({
                content_name: eventLabel,
                visitor: VISITOR_ID,
                firstSeen: FIRST_SEEN,
                page: window.location.href,
                page_path: window.location.pathname,
                referrer: document.referrer || 'direct',
                locale: navigator.language || 'unknown',
                language: (navigator.languages && navigator.languages.join(',')) || navigator.language || 'unknown',
                timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'unknown',
                screen: screen.width + 'x' + screen.height,
                viewport: window.innerWidth + 'x' + window.innerHeight,
                device: /Mobi|Android|iPhone/i.test(ua) ? 'mobile' : 'desktop',
                connection: (navigator.connection && navigator.connection.effectiveType) || 'unknown',
                platform: (navigator.userAgentData && navigator.userAgentData.platform) || 'unknown'
            }, campaign);
        }

        // Envia evento para o backend próprio (não bloqueia a navegação)
        function gabyTrack(eventName, extra) {
            const payload = Object.assign(getTrackingContext(eventName), {
                event: eventName,
                extra: extra || {}
            });
            try {
                const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                if (navigator.sendBeacon && navigator.sendBeacon(TRACK_ENDPOINT, blob)) return;
            } catch (error) {}
            try {
                fetch(TRACK_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    keepalive: true
                });
            } catch (error) {}
        }

        // Dispara conversão nos pixels + no backend próprio
        function trackClick(eventLabel) {
            const data = getTrackingContext(eventLabel);

            try { if (typeof gtag === 'function') gtag('event', 'generate_lead', data); } catch (e) {}
            try { if (typeof fbq === 'function') { fbq('track', 'Lead', data); fbq('trackCustom', 'CTAClick', data); } } catch (e) {}
            try { if (window.ttq && typeof ttq.track === 'function') { ttq.track('ClickButton', data); ttq.track('Lead', data); } } catch (e) {}

            (window.dataLayer = window.dataLayer || []).push({ event: 'cta_conversion', ...data });
            gabyTrack('cta_click', { label: eventLabel });
        }

        // Page view
        window.addEventListener('load', () => gabyTrack('page_view'));

        // Profundidade de scroll (25/50/75/100%)
        (function () {
            const marks = [25, 50, 75, 100];
            const seen = {};
            window.addEventListener('scroll', () => {
                const scrollable = document.documentElement.scrollHeight - window.innerHeight;
                const percent = scrollable <= 0 ? 100 : Math.round((window.scrollY / scrollable) * 100);
                marks.forEach((mark) => {
                    if (percent >= mark && !seen[mark]) {
                        seen[mark] = true;
                        gabyTrack('scroll_depth', { percent: mark });
                    }
                });
            }, { passive: true });
        })();

        // Tempo na página (enviado ao sair/minimizar)
        (function () {
            const start = Date.now();
            let sent = false;
            const send = () => {
                if (sent) return;
                sent = true;
                gabyTrack('time_on_page', { seconds: Math.round((Date.now() - start) / 1000) });
            };
            window.addEventListener('pagehide', send);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') send();
            });
        })();

    <script>
        (function () {
            // ---- Pixels: só carregam se houver IDs reais configurados ----
            function loadGA4(id) {
                const s = document.createElement('script');
                s.async = true;
                s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
                document.head.appendChild(s);
                window.dataLayer = window.dataLayer || [];
                window.gtag = function () { window.dataLayer.push(arguments); };
                gtag('js', new Date());
                gtag('config', id, { anonymize_ip: true });
            }

            function loadMetaPixel(id) {
                !function(f,b,e,v,n,t,s){
                    if(f.fbq)return;n=f.fbq=function(){n.callMethod?
                    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
                    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
                    n.queue=[];t=b.createElement(e);t.async=!0;
                    t.src=v;s=b.getElementsByTagName(e)[0];
                    s.parentNode.insertBefore(t,s)
                }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
                fbq('init', id);
                fbq('track', 'PageView');
            }

            function loadTikTokPixel(id) {
                !function(w,d,t){
                    w.TiktokAnalyticsObject=t;
                    var ttq=w[t]=w[t]||[];
                    ttq.methods=['page','track','identify','instances','debug','on','off','once','ready','alias','group','enableCookie','disableCookie'];
                    ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};
                    for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);
                    ttq.load=function(e,n){
                        var r='https://analytics.tiktok.com/i18n/pixel/events.js';
                        ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=r;ttq._t=ttq._t||{};ttq._t[e]=+new Date;ttq._o=ttq._o||{};ttq._o[e]=n||{};
                        var o=d.createElement('script');o.type='text/javascript';o.async=!0;o.src=r+'?sdkid='+e+'&lib='+t;
                        var a=d.getElementsByTagName('script')[0];a.parentNode.insertBefore(o,a)
                    };
                    ttq.load(id);
                    ttq.page();
                }(window,document,'ttq');
            }

            let pixelsLoaded = false;
            function loadConfiguredPixels() {
                if (pixelsLoaded) return;

            }

            loadConfiguredPixels();
        })();
